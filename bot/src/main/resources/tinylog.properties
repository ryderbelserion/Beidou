# This will write to console!
writerConsole = console
writerConsole.level = info
writerConsole.format = [{date: HH:mm:ss} {level}] [Bot thread/{file}]: {message}
writerConsole.tag = -

# This will write to console for guilds!
writerGuild = console
writerGuild.level = info
writerGuild.format = [{date: HH:mm:ss} {level}] [Guild thread/{file}]: {message}
writerGuild.tag = guild

# This will write to file as rolling release!
writerFile = rolling file
writerFile.level = info
writerFile.format = [{date: HH:mm:ss} {level}] [Bot thread/{file}]: {message}
writerFile.file = beidou/logs/{date: yyyy-MM-dd}-{count}.log
writerFile.latest = beidou/logs/latest.log
writerFile.charset = UTF-8
writerFile.buffered = false
writerFile.policies = startup
writerFile.convert = gzip